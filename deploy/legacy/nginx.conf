# Reprise de nginx.conf.example pour la pile legacy en conteneurs.
server {
  listen 80 default_server;
  server_tokens off;
  # proxy_pass avec variables : nginx résout le nom à chaque requête et a besoin
  # d'un résolveur (DNS interne de Docker). Inutile avec des adresses IP fixes.
  resolver 127.0.0.11 valid=30s ipv6=off;
  client_max_body_size 20M;
  large_client_header_buffers 4 256k;

  location ~* ^/data/xAPI(.*)$ {
    proxy_pass http://xapi:8081/data/xAPI$1$is_args$args;
    proxy_set_header Host $host;
  }

  location = /api {
    rewrite /api / break;
    proxy_redirect off;
    proxy_pass http://api:8080;
  }

  location ~* ^/api(.*)$ {
    proxy_pass http://api:8080$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://ui:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
