# Intégration continue de la version 2026 (branche v2026).
# Le code d'origine (legacy/) n'est ni construit ni testé ici : sa CI était CircleCI (legacy/.circleci).
name: CI

on:
  push:
    branches: [v2026]
  pull_request:
    branches: [v2026]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    # Bases jetables des tests d'intégration de l'API (base ll_test_* obligatoire, cf. apps/api).
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGO_TEST_URL: mongodb://127.0.0.1:27017/ll_test_api
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Avant le lint et le typage : l'API lit les types de @ll/shared dans packages/shared/dist.
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:tools
